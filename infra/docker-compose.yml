services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: school_voting
      POSTGRES_PASSWORD: school_voting
      POSTGRES_DB: school_voting
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U school_voting"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
